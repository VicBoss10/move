# filepath: /home/victor/Documentos/Proyecto Final/move/frontend/nginx.conf
server {
  listen 80;
  server_name localhost;

  # Directorio raíz donde se encuentran los archivos de Angular
  root /usr/share/nginx/html;
  index index.html index.htm;

  # Regla clave para Single Page Applications (SPA)
  # Si no se encuentra un archivo o directorio, sirve el index.html
  # para que el router de Angular se encargue de la ruta.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Opcional: Configuración para compresión Gzip (mejora el rendimiento)
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}