# filepath: /home/victor/Documentos/Proyecto Final/move/frontend/nginx.conf
server {
  listen 80;
  server_name localhost;

  # La raíz donde están todos los archivos
  root /usr/share/nginx/html;
  # Resolver para que nginx haga resolución DNS en tiempo de ejecución
  # (Docker embeded DNS en la red de compose: 127.0.0.11)
  resolver 127.0.0.11 valid=30s ipv6=off;

  # 1. Regla para la Landing Page
  # Si la petición es EXACTAMENTE la raíz "/", sirve el index.html de la landing.
  location = / {
    return 302 /assets/landing/index.html;
  }

  # 2. Regla para los assets de la Landing Page
  # Si la petición empieza con /assets/, primero busca en la carpeta /landing/assets/.
  # Si no lo encuentra, busca en la carpeta /assets/ de Angular.
  location /assets/ {
    try_files $uri $uri/ =404;
  }

  # 3. index.html nunca se cachea para que siempre apunte a los chunks actuales
  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # 4. Chunks JS/CSS con hash son inmutables: se cachean 1 año
  location ~* \.(js|css)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # 5. Regla para la Aplicación Angular (SPA)
  # Para CUALQUIER OTRA ruta (como /signin, /dashboard, etc.),
  # intenta servir el archivo si existe, si no, devuelve el index.html de Angular
  # para que el router de Angular se encargue.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 6. Proxy para streaming de video
  # nginx recibe /stream/* desde el browser (via Cloudflare → moveiot.online)
  # y lo proxea al servicio Python que corre en el HOST en el puerto 5000.
  location /stream/ {
    proxy_pass http://host.docker.internal:5000$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 10s;
    chunked_transfer_encoding off;
  }

  # Compresión
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}