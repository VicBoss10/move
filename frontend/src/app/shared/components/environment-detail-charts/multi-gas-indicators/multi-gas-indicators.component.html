<!-- Multi-Gas Indicators Component
     Displays three mini circular SVG gauges for CO, NO₂, and NH₃ with color-coded status.
     Shows current gas concentration with unit, status label, and responsive grid layout.
     Gradient backgrounds based on threshold status. -->

<div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
  @if (gasIndicators$ | async; as indicators) {
    @for (gas of indicators; track gas.symbol) {
      <div
        class="overflow-hidden rounded-2xl border border-gray-200 bg-gradient-to-br dark:border-gray-800 dark:bg-gradient-to-br dark:from-white/[0.03] dark:to-white/[0.02]"
        [ngClass]="gas.bgColor"
      >
        <div class="px-4 pt-4 sm:px-5 sm:pt-5">
          <h4 class="text-sm font-semibold text-gray-800 dark:text-white/90">
            {{ gas.symbol }}
          </h4>
          <p class="mt-0.5 text-xs text-gray-500 dark:text-gray-400">
            {{ gas.name }}
          </p>
        </div>
        <div class="flex flex-col items-center justify-center px-4 py-6 sm:px-5">
          <div class="relative w-28 h-28">
            <svg class="w-full h-full" viewBox="0 0 150 150">
              <circle
                cx="75"
                cy="75"
                r="65"
                fill="none"
                stroke="currentColor"
                stroke-width="8"
                class="text-gray-200 dark:text-gray-700"
              />
              <circle
                cx="75"
                cy="75"
                r="65"
                fill="none"
                [attr.stroke-dasharray]="409.6"
                [attr.stroke-dashoffset]="
                  409.6 - (409.6 * getGaugePercentage(gas.value, gas.maxValue)) / 100
                "
                stroke-width="8"
                stroke-linecap="round"
                [ngClass]="'origin-center -rotate-90 transition-all duration-500 ' + gas.color"
              />
              <text
                x="75"
                y="70"
                text-anchor="middle"
                class="text-2xl font-bold fill-current"
                [class]="gas.color"
              >
                {{ gas.value }}
              </text>
              <text
                x="75"
                y="88"
                text-anchor="middle"
                class="text-xs fill-gray-500 dark:fill-gray-400"
              >
                {{ gas.unit }}
              </text>
            </svg>
          </div>
          <p [class]="'mt-3 text-xs font-semibold ' + gas.color">
            {{ gas.status }}
          </p>
        </div>
      </div>
    }
  }
</div>
