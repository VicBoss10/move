<div class="overflow-hidden rounded-2xl border border-gray-200 bg-white px-5 pt-5 dark:border-gray-800 dark:bg-white/[0.03] sm:px-6 sm:pt-6">
  <!-- Header -->
  <div class="mb-6">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
      Tendencia de Humedad Relativa (24h)
    </h3>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
      Variación de humedad en las últimas 24 horas
    </p>
  </div>

  <!-- Chart Container -->
  <div class="max-w-full overflow-x-auto custom-scrollbar">
    <div class="-ml-5 min-w-[650px] xl:min-w-full pl-2">
      <ng-container *ngIf="chartData$ | async as data">
        <canvas
          baseChart
          type="line"
          [data]="data"
          [options]="chartOptions"
          style="max-height: 350px; position: relative;"
        ></canvas>
      </ng-container>
    </div>
  </div>

  <!-- Stats Footer -->
  <div class="mt-6 grid grid-cols-3 gap-4 border-t border-gray-200 pt-4 dark:border-gray-800">
    <ng-container *ngIf="chartData$ | async as data">
      <div class="text-center">
        <p class="text-xs font-semibold text-gray-500 dark:text-gray-400">Mínima</p>
        <p class="mt-1 text-sm font-bold text-blue-600 dark:text-blue-400">{{ getMinValue(data.datasets[0].data) | number: '1.0-1' }} %</p>
      </div>
      <div class="text-center">
        <p class="text-xs font-semibold text-gray-500 dark:text-gray-400">Promedio</p>
        <p class="mt-1 text-sm font-bold text-blue-600 dark:text-blue-400">{{ getAvgValue(data.datasets[0].data) | number: '1.0-1' }} %</p>
      </div>
      <div class="text-center">
        <p class="text-xs font-semibold text-gray-500 dark:text-gray-400">Máxima</p>
        <p class="mt-1 text-sm font-bold text-blue-600 dark:text-blue-400">{{ getMaxValue(data.datasets[0].data) | number: '1.0-1' }} %</p>
      </div>
    </ng-container>
  </div>
</div>
