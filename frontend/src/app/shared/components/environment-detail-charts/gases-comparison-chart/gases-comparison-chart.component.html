<div
  class="overflow-hidden rounded-2xl border border-gray-200 bg-white px-5 pt-5 dark:border-gray-800 dark:bg-white/[0.03] sm:px-6 sm:pt-6"
>
  <!-- Header -->
  <div class="mb-6">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
      Comparación de Gases (12h)
    </h3>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
      Tendencia de CO, NO₂ y NH₃ en las últimas 12 horas (promedio por hora)
    </p>
  </div>

  <!-- Chart Container -->
  <div class="max-w-full overflow-x-auto custom-scrollbar">
    <div class="-ml-5 min-w-[650px] xl:min-w-full pl-2">
      <ng-container *ngIf="chartData$ | async as data">
        <canvas
          baseChart
          type="line"
          [data]="data"
          [options]="chartOptions"
          style="max-height: 350px; position: relative"
        ></canvas>
      </ng-container>
    </div>
  </div>

  <!-- Stats Footer -->
  <div class="mt-6 border-t border-gray-200 pt-4 dark:border-gray-800">
    <p class="mb-3 text-xs font-semibold text-gray-500 dark:text-gray-400">RANGOS ACTUALES</p>
    <ng-container *ngIf="gasValues$ | async as values">
      <div class="grid grid-cols-2 gap-3 md:grid-cols-3">
        <div>
          <p class="text-xs text-gray-500 dark:text-gray-400">CO</p>
          <p class="mt-1 text-sm font-bold text-purple-600 dark:text-purple-400">
            {{ values.co }} ppm
          </p>
        </div>
        <div>
          <p class="text-xs text-gray-500 dark:text-gray-400">NO₂</p>
          <p class="mt-1 text-sm font-bold text-amber-600 dark:text-amber-400">
            {{ values.no2 }} µg/m³
          </p>
        </div>
        <div>
          <p class="text-xs text-gray-500 dark:text-gray-400">NH₃</p>
          <p class="mt-1 text-sm font-bold text-cyan-600 dark:text-cyan-400">
            {{ values.nh3 }} ppb
          </p>
        </div>
      </div>
    </ng-container>
  </div>
</div>
