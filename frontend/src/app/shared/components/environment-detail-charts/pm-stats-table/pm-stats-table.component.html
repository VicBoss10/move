<div class="overflow-hidden rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]">
  <!-- Header -->
  <div class="border-b border-gray-200 px-5 py-4 dark:border-gray-800 sm:px-6">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
      Estadísticas de Partículas
    </h3>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
      Últimas 24 horas
    </p>
  </div>

  <!-- Table -->
  <div class="overflow-x-auto">
    <table class="w-full">
      <thead class="border-b border-gray-200 bg-gray-50 dark:border-gray-800 dark:bg-gray-900/50">
        <tr>
          <th class="px-5 py-3 text-left text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 sm:px-6">
            Tipo de Partícula
          </th>
          <th class="px-5 py-3 text-right text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 sm:px-6">
            Actual
          </th>
          <th class="px-5 py-3 text-right text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 sm:px-6">
            Mínimo
          </th>
          <th class="px-5 py-3 text-right text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 sm:px-6">
            Máximo
          </th>
          <th class="px-5 py-3 text-right text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 sm:px-6">
            Promedio
          </th>
          <th class="px-5 py-3 text-right text-xs font-semibold uppercase text-gray-500 dark:text-gray-400 sm:px-6">
            Variación
          </th>
        </tr>
      </thead>
      <tbody>
        @for (pm of pmStats; track pm.symbol) {
        <tr class="border-b border-gray-200 transition-colors hover:bg-gray-50 dark:border-gray-800 dark:hover:bg-gray-900/50">
          <td class="whitespace-nowrap px-5 py-4 sm:px-6">
            <div>
              <p class="font-semibold text-gray-900 dark:text-white">{{ pm.symbol }}</p>
              <p class="text-xs text-gray-500 dark:text-gray-400">{{ pm.name }}</p>
            </div>
          </td>
          <td class="whitespace-nowrap px-5 py-4 text-right text-sm font-medium text-gray-900 dark:text-white sm:px-6">
            {{ pm.actual }} {{ pm.unit }}
          </td>
          <td class="whitespace-nowrap px-5 py-4 text-right text-sm text-gray-600 dark:text-gray-400 sm:px-6">
            {{ pm.minimo }}
          </td>
          <td class="whitespace-nowrap px-5 py-4 text-right text-sm text-gray-600 dark:text-gray-400 sm:px-6">
            {{ pm.maximo }}
          </td>
          <td class="whitespace-nowrap px-5 py-4 text-right text-sm font-medium text-blue-600 dark:text-blue-400 sm:px-6">
            {{ pm.promedio }}
          </td>
          <td class="whitespace-nowrap px-5 py-4 text-right text-sm font-medium sm:px-6" [class]="getVariationColor(pm.variacion)">
            {{ pm.variacion }}%
          </td>
        </tr>
        }
      </tbody>
    </table>
  </div>
</div>
