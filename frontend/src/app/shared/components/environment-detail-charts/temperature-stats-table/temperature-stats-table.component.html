<div
  class="overflow-hidden rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]"
>
  <!-- Header -->
  <div class="border-b border-gray-200 px-5 py-4 dark:border-gray-800 sm:px-6">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
      Estadísticas de Temperatura
    </h3>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Últimas 24 horas</p>
  </div>

  <!-- Stats Grid -->
  @if (stats$ | async; as stats) {
    <div class="grid grid-cols-2 gap-4 p-5 sm:grid-cols-5 sm:p-6">
      <!-- Actual -->
      <div class="text-center">
        <p class="text-xs font-semibold uppercase text-gray-500 dark:text-gray-400">Actual</p>
        <p class="mt-2 text-2xl font-bold text-gray-900 dark:text-white">
          {{ stats.actual }}
        </p>
        <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">°C</p>
      </div>
      <!-- Mínimo -->
      <div class="text-center">
        <p class="text-xs font-semibold uppercase text-gray-500 dark:text-gray-400">Mínimo</p>
        <p class="mt-2 text-2xl font-bold text-blue-600 dark:text-blue-400">
          {{ stats.minimo }}
        </p>
        <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">°C</p>
      </div>
      <!-- Máximo -->
      <div class="text-center">
        <p class="text-xs font-semibold uppercase text-gray-500 dark:text-gray-400">Máximo</p>
        <p class="mt-2 text-2xl font-bold text-orange-600 dark:text-orange-400">
          {{ stats.maximo }}
        </p>
        <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">°C</p>
      </div>
      <!-- Promedio -->
      <div class="text-center">
        <p class="text-xs font-semibold uppercase text-gray-500 dark:text-gray-400">Promedio</p>
        <p class="mt-2 text-2xl font-bold text-gray-900 dark:text-white">
          {{ stats.promedio }}
        </p>
        <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">°C</p>
      </div>
      <!-- Variación -->
      <div class="text-center">
        <p class="text-xs font-semibold uppercase text-gray-500 dark:text-gray-400">Variación</p>
        <p [class]="'mt-2 text-2xl font-bold ' + getVariationColor(stats.variacion)">
          {{ stats.variacion }}°C
        </p>
        <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">24h</p>
      </div>
    </div>
  }
</div>
