<div class="space-y-6">
  <!-- Encabezado -->
  <div class="flex flex-col gap-2">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Dispositivos Conectados</h1>
    <p class="text-gray-600 dark:text-gray-400">
      Lista de todos los dispositivos de sensor activos en el sistema y su estado de conexión
    </p>
  </div>

  <!-- Tabla de Dispositivos -->
  <div class="overflow-x-auto rounded-lg border border-gray-200 dark:border-gray-700">
    <table class="min-w-full">
      <thead class="border-b border-gray-200 bg-gray-50 dark:border-gray-700 dark:bg-gray-800">
        <tr>
          <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900 dark:text-gray-100">
            Nombre del Dispositivo
          </th>
          <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900 dark:text-gray-100">
            Tipo
          </th>
          <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900 dark:text-gray-100">
            Estado
          </th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
        <tr
          *ngFor="let device of devices$ | async"
          class="transition-colors hover:bg-gray-50 dark:hover:bg-gray-700/50"
        >
          <td class="px-6 py-4">
            <div class="flex items-center gap-3">
              <svg
                class="h-5 w-5 text-blue-600 dark:text-blue-400"
                fill="currentColor"
                viewBox="0 0 20 20"
              >
                <path
                  d="M10.5 1.5H3.75A2.25 2.25 0 001.5 3.75v12.5A2.25 2.25 0 003.75 18.5h12.5a2.25 2.25 0 002.25-2.25V9.5"
                />
              </svg>
              <span class="text-sm font-medium text-gray-900 dark:text-gray-100">{{
                device.name
              }}</span>
            </div>
          </td>
          <td class="px-6 py-4">
            <span
              class="inline-flex rounded-full bg-blue-100 px-3 py-1 text-xs font-medium text-blue-800 dark:bg-blue-900 dark:text-blue-300"
            >
              {{ device.type }}
            </span>
          </td>
          <td class="px-6 py-4">
            <span
              [ngClass]="getStatusColor(device.status)"
              class="inline-flex items-center gap-1 rounded-full px-3 py-1 text-xs font-medium"
            >
              {{ getStatusIcon(device.status) }}
              {{ device.status }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
