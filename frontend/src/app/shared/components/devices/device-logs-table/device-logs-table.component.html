<div class="space-y-6">
  <!-- Encabezado -->
  <div class="flex flex-col gap-2">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Logs del Sistema</h1>
    <p class="text-gray-600 dark:text-gray-400">
      Registro de eventos, errores y actividades de los dispositivos
    </p>
  </div>

  <!-- Tabla de Logs -->
  <div class="overflow-x-auto rounded-lg border border-gray-200 dark:border-gray-700">
    <table class="min-w-full">
      <thead class="border-b border-gray-200 bg-gray-50 dark:border-gray-700 dark:bg-gray-800">
        <tr>
          <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900 dark:text-gray-100">
            Dispositivo
          </th>
          <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900 dark:text-gray-100">
            Nivel
          </th>
          <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900 dark:text-gray-100">
            Mensaje
          </th>
          <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900 dark:text-gray-100">
            Detalles
          </th>
          <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900 dark:text-gray-100">
            Timestamp
          </th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
        <tr *ngFor="let log of logs$ | async" class="transition-colors hover:bg-gray-50 dark:hover:bg-gray-700/50">
          <td class="px-6 py-4 text-sm font-medium text-gray-900 dark:text-gray-100">
            {{ log.deviceName }}
          </td>
          <td class="px-6 py-4">
            <span [ngClass]="getLevelColor(log.level)" class="inline-flex items-center gap-1 rounded-full px-3 py-1 text-xs font-medium">
              {{ getLevelIcon(log.level) }}
              {{ log.level }}
            </span>
          </td>
          <td class="px-6 py-4 text-sm text-gray-600 dark:text-gray-400">
            {{ log.message }}
          </td>
          <td class="px-6 py-4 text-sm text-gray-600 dark:text-gray-400">
            <span class="line-clamp-1">{{ log.details }}</span>
          </td>
          <td class="px-6 py-4 text-sm text-gray-600 dark:text-gray-400">
            {{ log.timestamp | date:'short' }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
