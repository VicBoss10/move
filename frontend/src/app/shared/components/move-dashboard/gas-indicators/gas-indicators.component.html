<div class="overflow-hidden rounded-2xl border border-gray-200 bg-white px-5 pt-5 dark:border-gray-800 dark:bg-white/[0.03] sm:px-6 sm:pt-6">
  <!-- Header -->
  <div class="mb-6">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
      Indicadores de Gases
    </h3>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
      Niveles actuales de contaminantes atmosféricos
    </p>
  </div>

  <!-- Grid de Gauges -->
  <div class="grid grid-cols-2 gap-4 sm:grid-cols-4 md:gap-6">
    <div *ngFor="let gas of gasIndicators" class="flex flex-col items-center">
      <!-- SVG Gauge -->
      <div class="relative w-24 h-24">
        <svg viewBox="0 0 100 100" class="w-full h-full">
          <!-- Background arc (light gray) -->
          <path
            [attr.d]="getBackgroundArcPath(45)"
            fill="none"
            stroke="currentColor"
            stroke-width="8"
            class="text-gray-200 dark:text-gray-700"
          />
          
          <!-- Progress arc (colored) -->
          <path
            [attr.d]="getArcPath(getGaugeAngle(getPercentage(gas)), 45)"
            fill="none"
            stroke="currentColor"
            stroke-width="8"
            [style.color]="gas.color"
            stroke-linecap="round"
          />
          
          <!-- Center circle -->
          <circle cx="50" cy="50" r="28" fill="currentColor" class="text-white dark:text-gray-800" />
          
          <!-- Value text -->
          <text x="50" y="48" text-anchor="middle" class="text-sm font-bold" fill="currentColor" class="text-gray-900 dark:text-white">
            {{ gas.value | number: '1.1-1' }}
          </text>
          <text x="50" y="58" text-anchor="middle" class="text-xs" fill="currentColor" class="text-gray-500 dark:text-gray-400">
            {{ gas.unit }}
          </text>
        </svg>
      </div>

      <!-- Label and Status -->
      <div class="mt-3 text-center w-full">
        <h4 class="font-semibold text-gray-800 dark:text-white text-sm">{{ gas.label }}</h4>
        <span [class]="'inline-flex items-center mt-1 px-2 py-0.5 rounded-full text-xs font-semibold ' + getStatusBgColor(gas.status) + ' ' + getStatusTextColor(gas.status)">
          {{ getStatusLabel(gas.status) }}
        </span>
      </div>
    </div>
  </div>

  <!-- Footer info -->
  <div class="mt-6 border-t border-gray-200 pt-4 dark:border-gray-800">
    <p class="text-xs text-gray-500 dark:text-gray-400">
      <span class="inline-block w-3 h-3 rounded-full mr-2" style="background-color: #10b981;"></span>Verde: Bueno
      <span class="inline-block w-3 h-3 rounded-full mr-2 ml-3" style="background-color: #f59e0b;"></span>Amarillo: Moderado
      <span class="inline-block w-3 h-3 rounded-full mr-2 ml-3" style="background-color: #ef4444;"></span>Rojo: Pobre
    </p>
  </div>
</div>
