<div class="overflow-hidden rounded-2xl border border-gray-200 bg-white px-5 pt-5 dark:border-gray-800 dark:bg-white/[0.03] sm:px-6 sm:pt-6">
  <!-- Header -->
  <div class="mb-6">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
      Actividad Vehicular
    </h3>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
      Tipos de vehículos detectados hoy
    </p>
  </div>

  <!-- Chart Container -->
  <div class="max-w-full overflow-x-auto custom-scrollbar">
    <div class="-ml-5 min-w-[650px] xl:min-w-full pl-2">
      <ng-container *ngIf="chartData$ | async as data">
        <canvas
          baseChart
          type="bar"
          [data]="data"
          [options]="chartOptions"
          style="max-height: 300px; position: relative;"
        ></canvas>
      </ng-container>
    </div>
  </div>

  <!-- Stats Footer -->
  <div class="mt-6 border-t border-gray-200 pt-4 dark:border-gray-800">
    <ng-container *ngIf="vehicleCounts$ | async as counts">
      <div class="grid grid-cols-5 gap-3">
        <div class="text-center">
          <div class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-blue-100 dark:bg-blue-900/20">
            <div class="h-3 w-3 rounded-full bg-blue-500"></div>
          </div>
          <p class="mt-2 text-xs font-semibold text-gray-800 dark:text-white">Carros</p>
          <p class="text-sm font-bold text-blue-600 dark:text-blue-400">{{ counts[0] }}</p>
        </div>
        <div class="text-center">
          <div class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-green-100 dark:bg-green-900/20">
            <div class="h-3 w-3 rounded-full bg-green-500"></div>
          </div>
          <p class="mt-2 text-xs font-semibold text-gray-800 dark:text-white">Motos</p>
          <p class="text-sm font-bold text-green-600 dark:text-green-400">{{ counts[1] }}</p>
        </div>
        <div class="text-center">
          <div class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-orange-100 dark:bg-orange-900/20">
            <div class="h-3 w-3 rounded-full bg-orange-500"></div>
          </div>
          <p class="mt-2 text-xs font-semibold text-gray-800 dark:text-white">Buses</p>
          <p class="text-sm font-bold text-orange-600 dark:text-orange-400">{{ counts[2] }}</p>
        </div>
        <div class="text-center">
          <div class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-red-100 dark:bg-red-900/20">
            <div class="h-3 w-3 rounded-full bg-red-500"></div>
          </div>
          <p class="mt-2 text-xs font-semibold text-gray-800 dark:text-white">Camiones</p>
          <p class="text-sm font-bold text-red-600 dark:text-red-400">{{ counts[3] }}</p>
        </div>
        <div class="text-center">
          <div class="inline-flex h-10 w-10 items-center justify-center rounded-full bg-purple-100 dark:bg-purple-900/20">
            <div class="h-3 w-3 rounded-full bg-purple-500"></div>
          </div>
          <p class="mt-2 text-xs font-semibold text-gray-800 dark:text-white">Bicicletas</p>
          <p class="text-sm font-bold text-purple-600 dark:text-purple-400">{{ counts[4] }}</p>
        </div>
      </div>

      <!-- Total -->
      <div class="mt-4 flex items-center justify-between rounded-lg bg-gray-50 p-3 dark:bg-gray-900/50">
        <span class="text-sm font-semibold text-gray-700 dark:text-gray-300">Total detectado:</span>
        <span class="text-lg font-bold text-gray-900 dark:text-white">{{ counts[0] + counts[1] + counts[2] + counts[3] + counts[4] }} vehículos</span>
      </div>
    </ng-container>
  </div>
</div>
