<!-- System Status Component
     Displays grid of system status cards showing online/offline status for devices and services -->

<div class="grid grid-cols-1 gap-4 sm:grid-cols-3 md:gap-6">
  @if (statusCards$ | async; as cards) {
    @for (card of cards; track card) {
      <div [class]="'rounded-2xl border p-5 md:p-6 ' + getStatusColor(card.status)">
        <!-- Icon container with status color background -->
        <div
          class="flex items-center justify-center w-12 h-12 rounded-xl"
          [class.bg-green-100]="card.status === 'online' || card.status === 'active'"
          [class.dark:bg-green-800]="card.status === 'online' || card.status === 'active'"
          [class.bg-red-100]="card.status === 'offline' || card.status === 'inactive'"
          [class.dark:bg-red-800]="card.status === 'offline' || card.status === 'inactive'"
        >
          <span [innerHTML]="card.icon | safeHtml" [class]="getTextColor(card.status)"></span>
        </div>
        <!-- Content area with label, primary and secondary status information -->
        <div class="mt-5">
          <span class="text-sm text-gray-500 dark:text-gray-400">{{ card.label }}</span>
          <h4 [class]="'mt-2 font-bold text-title-sm ' + getTextColor(card.status)">
            {{ card.primary }}
          </h4>
          @if (card.secondary) {
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
              {{ card.secondary }}
            </p>
          }
        </div>
      </div>
    }
  } @else {
    <div class="col-span-1 sm:col-span-3 flex items-center justify-center py-16">
      <div class="flex flex-col items-center gap-3">
        <div
          class="h-8 w-8 animate-spin rounded-full border-4 border-gray-200 border-t-brand-500 dark:border-gray-700 dark:border-t-brand-500"
        ></div>
        <p class="text-sm text-gray-500 dark:text-gray-400">Cargando estado del sistema...</p>
      </div>
    </div>
  }
</div>
