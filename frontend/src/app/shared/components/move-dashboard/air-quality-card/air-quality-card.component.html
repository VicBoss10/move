<!-- Air Quality Card Component
     Displays grid of air quality metric cards with status indicators and numerical values -->

<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:gap-6">
  @if (metrics$ | async; as metrics) {
    @if (metrics && metrics.length > 0) {
      <!-- Air quality metric cards grid with status badges and values -->
      @for (metric of metrics; track metric) {
        <div
          [class]="'rounded-2xl border p-5 md:p-6 ' + ColorUtility.getStatusBgColor(metric.status)"
        >
          <!-- Icon container with status color background and status badge -->
          <div class="flex items-center justify-between">
            <div
              class="flex items-center justify-center w-12 h-12 rounded-xl"
              [class]="ColorUtility.getStatusIconBgColor(metric.status)"
            >
              <span
                [innerHTML]="metric.icon | safeHtml"
                [class]="ColorUtility.getStatusIconColor(metric.status)"
              ></span>
            </div>
            <span
              [class]="
                'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ' +
                ColorUtility.getStatusTextColor(metric.status)
              "
            >
              {{ metric.statusLabel }}
            </span>
          </div>
          <!-- Content area with metric label, value and unit -->
          <div class="mt-5">
            <span class="text-sm text-gray-500 dark:text-gray-400">{{ metric.label }}</span>
            <!-- Primary value with unit -->
            <div class="mt-2 flex items-baseline gap-1">
              <h4 [class]="'font-bold text-3xl ' + ColorUtility.getStatusTextColor(metric.status)">
                {{ metric.value }}
              </h4>
              <span class="text-xs text-gray-500 dark:text-gray-400">{{ metric.unit }}</span>
            </div>
          </div>
        </div>
      }
    } @else {
      <!-- Empty state when no air quality metrics are available -->
      <div class="col-span-1 sm:col-span-2 py-8 flex items-center justify-center">
        <div class="text-center">
          <p class="text-gray-500 dark:text-gray-400">Sin datos disponibles</p>
          <p class="text-sm text-gray-400 dark:text-gray-500 mt-1">
            Verifica tu conexión con el servidor
          </p>
        </div>
      </div>
    }
  }
</div>
