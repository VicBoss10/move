<!-- Sección Unificada: Búsqueda + Tabla -->
<div class="rounded-lg border border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800">
  <div class="border-b border-gray-200 p-6 dark:border-gray-700">
    <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Ubicaciones de Monitoreo</h3>

    <form class="w-full max-w-md mt-4">
      <input
        type="text"
        id="locationSearch"
        [formControl]="searchControl"
        placeholder="Buscar ubicación..."
        autocomplete="off"
        class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 placeholder-gray-500 focus:border-brand-300 focus:ring-1 focus:ring-brand-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-brand-400"
      />
    </form>
  </div>

  <app-location-table
    [locations]="(locations$ | async) || []"
    (locationChanged)="onLocationChanged()"
  />
</div>
