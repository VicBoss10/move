<div class="rounded-lg border border-gray-200 bg-white p-6 dark:border-gray-700 dark:bg-gray-800">
  <h3 class="mb-4 text-lg font-semibold text-gray-900 dark:text-white">Filtrar Ubicaciones</h3>

  <form class="grid gap-4 md:grid-cols-2 lg:grid-cols-4">
    <!-- Zona Geográfica -->
    <div>
      <label for="zone" class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300">
        Zona Geográfica
      </label>
      <select
        id="zone"
        [(ngModel)]="filters.zone"
        name="zone"
        class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 placeholder-gray-500 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-blue-400"
      >
        <option *ngFor="let zone of zones" [value]="zone.value">
          {{ zone.label }}
        </option>
      </select>
    </div>

    <!-- Calidad Mínima -->
    <div>
      <label for="quality" class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300">
        Calidad Mínima (%)
      </label>
      <input
        type="number"
        id="quality"
        [(ngModel)]="filters.quality"
        name="quality"
        min="0"
        max="100"
        placeholder="Ej: 80"
        class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 placeholder-gray-500 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-blue-400"
      />
    </div>

    <!-- Fecha de Inicio -->
    <div>
      <label for="startDate" class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300">
        Desde
      </label>
      <input
        type="date"
        id="startDate"
        [value]="formatDateForInput(filters.startDate)"
        (change)="onStartDateChange($any($event).target.value)"
        class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 placeholder-gray-500 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-blue-400"
      />
    </div>

    <!-- Fecha de Fin -->
    <div>
      <label for="endDate" class="mb-2 block text-sm font-medium text-gray-700 dark:text-gray-300">
        Hasta
      </label>
      <input
        type="date"
        id="endDate"
        [value]="formatDateForInput(filters.endDate)"
        (change)="onEndDateChange($any($event).target.value)"
        class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 placeholder-gray-500 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-blue-400"
      />
    </div>
  </form>

  <!-- Botones -->
  <div class="mt-6 flex gap-3">
    <button
      (click)="applyFilters()"
      class="flex-1 rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:focus:ring-offset-gray-800"
    >
      Aplicar Filtros
    </button>
    <button
      (click)="clearFilters()"
      class="flex-1 rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600 dark:focus:ring-offset-gray-800"
    >
      Limpiar
    </button>
  </div>
</div>
