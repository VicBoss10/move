<div class="toast-container fixed right-5 z-60 flex flex-col gap-3 max-w-sm">
  @for (t of toasts; track t) {
    <div
      class="toast-item shadow-lg rounded-lg border p-3 bg-white dark:bg-gray-800 flex items-start gap-3 pointer-events-auto"
      [ngClass]="getContainerClass(t.variant)"
    >
      <div class="flex-shrink-0">
        @if (t.variant === 'success') {
          <svg
            class="w-6 h-6 text-green-500"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M9 12.5l2 2 4-4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        }
        @if (t.variant === 'error') {
          <svg
            class="w-6 h-6 text-red-500"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M12 9v4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M12 17h.01"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        }
        @if (t.variant === 'warning') {
          <svg
            class="w-6 h-6 text-yellow-500"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M10.29 3.86L1.82 18a1.5 1.5 0 001.29 2.25h17.78a1.5 1.5 0 001.29-2.25L13.71 3.86a1.5 1.5 0 00-2.42 0z"
              stroke="currentColor"
              stroke-width="0"
            />
          </svg>
        }
        @if (t.variant === 'info') {
          <svg
            class="w-6 h-6 text-blue-500"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M12 12v4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M12 8h.01"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        }
      </div>
      <div class="flex-1">
        <div class="flex items-start justify-between gap-2">
          <div>
            @if (t.title) {
              <div class="font-medium text-sm text-gray-900 dark:text-gray-100">
                {{ t.title }}
              </div>
            }
            <div class="text-sm text-gray-700 dark:text-gray-300 break-words">{{ t.message }}</div>
          </div>
          <button (click)="dismiss(t.id)" class="text-gray-400 hover:text-gray-600 ml-2">✕</button>
        </div>
      </div>
    </div>
  }
</div>
