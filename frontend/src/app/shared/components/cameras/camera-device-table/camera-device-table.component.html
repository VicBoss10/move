<div class="overflow-x-auto rounded-lg border border-gray-200 dark:border-gray-700">
  <table class="min-w-full">
    <!-- Header -->
    <thead class="border-b border-gray-200 bg-gray-50 dark:border-gray-700 dark:bg-gray-800">
      <tr>
        <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900 dark:text-gray-100">
          ID
        </th>
        <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900 dark:text-gray-100">
          Nombre del Dispositivo
        </th>
        <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900 dark:text-gray-100">
          Estado
        </th>
        <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900 dark:text-gray-100">
          Ubicación
        </th>
        <th class="px-6 py-4 text-left text-sm font-semibold text-gray-900 dark:text-gray-100">
          Coordenadas
        </th>
      </tr>
    </thead>
    <!-- Body -->
    <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
      <tr
        *ngFor="let device of devices"
        class="transition-colors hover:bg-gray-50 dark:hover:bg-gray-700/50"
      >
        <!-- ID -->
        <td class="px-6 py-4 text-sm font-medium text-gray-900 dark:text-gray-100">
          #{{ device.id }}
        </td>

        <!-- Nombre -->
        <td class="px-6 py-4">
          <div class="flex items-center gap-3">
            <div
              class="flex h-10 w-10 items-center justify-center rounded-full bg-blue-100 dark:bg-blue-900"
            >
              <svg
                class="h-5 w-5 text-blue-600 dark:text-blue-400"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.219A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"
                />
              </svg>
            </div>
            <span class="text-sm font-medium text-gray-900 dark:text-gray-100">
              {{ device.name }}
            </span>
          </div>
        </td>

        <!-- Estado -->
        <td class="px-6 py-4">
          <span [ngClass]="getStateColor(device.state)" class="inline-flex items-center gap-1 rounded-full px-3 py-1 text-xs font-medium">
            {{ getStateIcon(device.state) }}
            {{ getStateLabel(device.state) }}
          </span>
        </td>

        <!-- Ubicación -->
        <td class="px-6 py-4">
          <div class="flex items-center gap-2">
            <svg
              class="h-4 w-4 text-gray-400 dark:text-gray-500"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
            <span class="text-sm text-gray-600 dark:text-gray-400">
              {{ device.location.description }}
            </span>
          </div>
        </td>

        <!-- Coordenadas -->
        <td class="px-6 py-4">
          <code class="rounded bg-gray-100 px-2 py-1 text-xs text-gray-700 dark:bg-gray-700 dark:text-gray-300">
            {{ formatCoordinates(device.location.latitude, device.location.length) }}
          </code>
        </td>
      </tr>
    </tbody>
  </table>
</div>
