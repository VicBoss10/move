<!-- Line and bar charts grid showing vehicle detection trends and distribution -->
<div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
  <!-- Line chart showing hourly detection trend for last 12 hours -->
  <div
    class="group overflow-hidden rounded-2xl border border-slate-200 bg-gradient-to-br from-white to-slate-50 px-5 pt-5 shadow-sm transition-all duration-300 hover:shadow-lg hover:border-slate-300 dark:border-slate-700 dark:from-slate-900 dark:to-slate-800/50 dark:hover:border-slate-600 sm:px-6 sm:pt-6"
  >
    <!-- Section header with title and description -->
    <div class="mb-6">
      <h3
        class="text-xl font-bold bg-gradient-to-r from-slate-800 to-slate-600 bg-clip-text text-transparent dark:from-white dark:to-slate-200"
      >
        Detecciones por Hora
      </h3>
      <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">
        Tendencia de detecciones en las últimas 12 horas
      </p>
    </div>

    <!-- Scrollable line chart container with animation -->
    <div class="relative max-w-full overflow-x-auto custom-scrollbar pb-4">
      <div class="animate-fadeIn -ml-5 min-w-[650px] xl:min-w-full pl-2">
        @if (lineChartData$ | async; as data) {
          <canvas
            baseChart
            type="line"
            [data]="data"
            [options]="lineChartOptions"
            style="max-height: 380px; position: relative"
          ></canvas>
        }
      </div>
    </div>
  </div>

  <!-- Bar chart showing vehicle type distribution -->
  <div
    class="group overflow-hidden rounded-2xl border border-slate-200 bg-gradient-to-br from-white to-slate-50 px-5 pt-5 shadow-sm transition-all duration-300 hover:shadow-lg hover:border-slate-300 dark:border-slate-700 dark:from-slate-900 dark:to-slate-800/50 dark:hover:border-slate-600 sm:px-6 sm:pt-6"
  >
    <!-- Section header with title and description -->
    <div class="mb-6">
      <h3
        class="text-xl font-bold bg-gradient-to-r from-slate-800 to-slate-600 bg-clip-text text-transparent dark:from-white dark:to-slate-200"
      >
        Vehículos por Tipo
      </h3>
      <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">
        Distribución de tipos de vehículos detectados
      </p>
    </div>

    <!-- Scrollable bar chart container with animation -->
    <div class="relative max-w-full overflow-x-auto custom-scrollbar pb-4">
      <div class="animate-fadeIn -ml-5 min-w-[650px] xl:min-w-full pl-2">
        @if (barChartData$ | async; as data) {
          <canvas
            baseChart
            type="bar"
            [data]="data"
            [options]="barChartOptions"
            style="max-height: 380px; position: relative"
          ></canvas>
        }
      </div>
    </div>
  </div>
</div>

<style>
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .animate-fadeIn {
    animation: fadeIn 0.6s ease-out;
  }
</style>
