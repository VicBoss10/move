<div
  class="group overflow-hidden rounded-2xl border border-slate-200 bg-gradient-to-br from-white to-slate-50 px-5 pt-5 shadow-sm transition-all duration-300 hover:shadow-lg hover:border-slate-300 dark:border-slate-700 dark:from-slate-900 dark:to-slate-800/50 dark:hover:border-slate-600 sm:px-6 sm:pt-6"
>
  <div class="mb-6">
    <h3
      class="text-xl font-bold bg-gradient-to-r from-slate-800 to-slate-600 bg-clip-text text-transparent dark:from-white dark:to-slate-200"
    >
      Detecciones por Hora
    </h3>
    <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">
      Tendencia de detecciones en las últimas 24 horas
    </p>
  </div>

  <div class="relative max-w-full overflow-x-auto custom-scrollbar pb-4">
    <div class="animate-fadeIn -ml-5 min-w-[650px] xl:min-w-full pl-2" style="height: 380px; position: relative;">
      @if (lineChartData$ | async; as data) {
        <canvas
          baseChart
          type="line"
          [data]="data"
          [options]="lineChartOptions"
        ></canvas>
      }
    </div>
  </div>
</div>
