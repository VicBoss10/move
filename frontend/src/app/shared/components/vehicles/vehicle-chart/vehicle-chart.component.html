<div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
  <!-- Detecciones por Hora -->
  <div
    class="overflow-hidden rounded-2xl border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-white/[0.03]"
  >
    <h3 class="mb-6 text-lg font-semibold text-gray-800 dark:text-white/90">
      Detecciones por Hora
    </h3>
    <div class="relative h-80">
      <canvas
        baseChart
        [type]="lineChartConfig.type"
        [data]="lineChartConfig.data"
        [options]="lineChartConfig.options"
      ></canvas>
    </div>
  </div>

  <!-- Tipos de Vehículos -->
  <div
    class="overflow-hidden rounded-2xl border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-white/[0.03]"
  >
    <h3 class="mb-6 text-lg font-semibold text-gray-800 dark:text-white/90">Vehículos por Tipo</h3>
    <div class="relative h-80">
      <canvas
        baseChart
        [type]="barChartConfig.type"
        [data]="barChartConfig.data"
        [options]="barChartConfig.options"
      ></canvas>
    </div>
  </div>
</div>
