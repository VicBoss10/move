<!-- Vehicle Filters Component
     Filter panel for vehicle detections by type, location, and date range.
     Emits filter criteria changes and supports clearing all filters.
     Includes vehicle type selector, location dropdown, and date range pickers. -->

<div
  class="overflow-hidden rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]"
>
  <!-- Page header with title and description -->
  <div class="border-b border-gray-200 px-5 py-4 dark:border-gray-800 sm:px-6">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
      Filtros de Vehículos Detectados
    </h3>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
      Filtra vehículos detectados por tipo, ubicación y rango de fechas
    </p>
  </div>

  <!-- Filter form with vehicle type, location, and date selectors -->
  <div class="p-5 sm:p-6">
    <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-4">
      <!-- Tipo de Vehículo -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
          Tipo de Vehículo
        </label>
        <select
          [(ngModel)]="selectedType"
          class="mt-2 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm dark:border-gray-600 dark:bg-gray-800 dark:text-white"
        >
          <option value="">Todos los tipos</option>
          @for (type of vehicleTypes; track type) {
            <option [value]="type.value">
              {{ type.label }}
            </option>
          }
        </select>
      </div>

      <!-- Ubicación -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
          Ubicación
        </label>
        <select
          [(ngModel)]="selectedLocationId"
          class="mt-2 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm dark:border-gray-600 dark:bg-gray-800 dark:text-white"
        >
          <option value="">Todas las ubicaciones</option>
          @for (location of locations$ | async; track location.locationId) {
            <option [value]="location!.locationId">
              {{ location!.label }}
            </option>
          }
        </select>
      </div>

      <!-- Fecha Inicio -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
          Fecha Inicio
        </label>
        <input
          type="date"
          [(ngModel)]="startDate"
          class="mt-2 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm dark:border-gray-600 dark:bg-gray-800 dark:text-white"
        />
      </div>

      <!-- Fecha Fin -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
          Fecha Fin
        </label>
        <input
          type="date"
          [(ngModel)]="endDate"
          class="mt-2 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm dark:border-gray-600 dark:bg-gray-800 dark:text-white"
        />
      </div>
    </div>

    <!-- Apply and clear buttons for filter actions -->
    <div class="mt-6 flex gap-3">
      <button
        (click)="applyFilters()"
        class="flex items-center gap-2 rounded-lg bg-brand-500 px-4 py-2 text-sm font-medium text-white hover:bg-brand-600 dark:bg-brand-600 dark:hover:bg-brand-700"
      >
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"
          />
        </svg>
        Aplicar Filtros
      </button>
      <button
        (click)="clearFilters()"
        class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-600 dark:text-gray-300 dark:hover:bg-gray-800"
      >
        Limpiar
      </button>
    </div>
  </div>
</div>
