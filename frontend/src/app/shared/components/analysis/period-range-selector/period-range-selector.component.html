<!-- Period Range Selector Component
     Dual-mode period selector: preset quick buttons (24h/7d/30d) that emit immediately,
     and a custom date range picker with start/end validation that emits on Apply. -->

<div
  class="overflow-hidden rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]"
>
  <div class="border-b border-gray-200 px-5 py-4 dark:border-gray-800 sm:px-6">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">Período de análisis</h3>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
      Selecciona un período rápido o define un rango de fechas personalizado
    </p>
  </div>

  <div class="p-5 sm:p-6">
    <!-- Quick preset buttons -->
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-sm font-medium text-gray-600 dark:text-gray-400">Período rápido:</span>
      @for (opt of quickOptions; track opt.key) {
        <button
          (click)="selectQuick(opt.key)"
          [disabled]="isValidating"
          [ngClass]="
            selectedQuick === opt.key
              ? 'bg-brand-500 text-white hover:bg-brand-600 dark:bg-brand-600 dark:hover:bg-brand-700'
              : 'border border-gray-300 bg-white text-gray-600 hover:bg-gray-50 dark:border-gray-600 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700'
          "
          class="rounded-lg px-3 py-1.5 text-xs font-semibold transition-colors duration-150 disabled:cursor-not-allowed disabled:opacity-50"
        >
          {{ opt.label }}
        </button>
      }
    </div>

    <!-- Visual divider -->
    <div class="my-5 flex items-center gap-3">
      <div class="h-px flex-1 bg-gray-200 dark:bg-gray-700"></div>
      <span class="text-xs text-gray-400 dark:text-gray-500">o rango personalizado</span>
      <div class="h-px flex-1 bg-gray-200 dark:bg-gray-700"></div>
    </div>

    <!-- Location, parameter and date range inputs -->
    <div class="grid grid-cols-1 gap-4" [ngClass]="gridColsClass">
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
          Fecha inicio
        </label>
        <input
          type="date"
          [(ngModel)]="startDate"
          (ngModelChange)="onDateChange()"
          [min]="minDate"
          [max]="maxDate"
          class="mt-2 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm dark:border-gray-600 dark:bg-gray-800 dark:text-white"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
          Fecha fin
        </label>
        <input
          type="date"
          [(ngModel)]="endDate"
          (ngModelChange)="onDateChange()"
          [min]="minDate"
          [max]="maxDate"
          class="mt-2 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm dark:border-gray-600 dark:bg-gray-800 dark:text-white"
        />
      </div>

      @if (showLocation) {
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Ubicación</label>
          <select
            [(ngModel)]="selectedLocationId"
            class="mt-2 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm dark:border-gray-600 dark:bg-gray-800 dark:text-white"
          >
            <option value="">Todas las ubicaciones</option>
            @for (location of locations$ | async; track location.locationId) {
              <option [value]="location.locationId">{{ location.label }}</option>
            }
          </select>
        </div>
      }

      @if (showMetric) {
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Parámetro</label>
          <select
            [(ngModel)]="selectedMetric"
            class="mt-2 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm dark:border-gray-600 dark:bg-gray-800 dark:text-white"
          >
            @for (m of metrics; track m.key) {
              <option [value]="m.key">{{ m.label }} ({{ m.unit }})</option>
            }
          </select>
        </div>
      }
    </div>

    <!-- Inline validation error -->
    @if (dateError) {
      <p class="mt-3 text-sm text-red-500">{{ dateError }}</p>
    }

    <!-- Action buttons -->
    <div class="mt-4 flex gap-3">
      <button
        (click)="applyCustomRange()"
        [disabled]="isValidating"
        class="flex items-center gap-2 rounded-lg bg-brand-500 px-4 py-2 text-sm font-medium text-white hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-60 dark:bg-brand-600 dark:hover:bg-brand-700"
      >
        @if (isValidating) {
          <svg class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
          </svg>
          Verificando…
        } @else {
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"
            />
          </svg>
          Aplicar rango
        }
      </button>
      <button
        (click)="clearCustomRange()"
        [disabled]="isValidating"
        class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50 dark:border-gray-600 dark:text-gray-300 dark:hover:bg-gray-800"
      >
        Limpiar
      </button>
    </div>
  </div>
</div>
