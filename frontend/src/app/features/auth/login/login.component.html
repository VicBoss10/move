<app-header></app-header>

<main class="main">
  <section class="section section-with-header">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5" data-aos="fade-up">
          <div class="login-form-wrapper p-4 rounded-4 shadow">

            <!-- 1. Header Section -->
            <div class="text-center mb-4">
              <h2 class="sitename mb-2">MOVE</h2>
              <p class="lead mb-3">Ingresa a tu cuenta</p>
            </div>

            <!-- 2. Form Section -->
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="php-email-form">
              <!-- Email -->
              <div class="form-group mb-3">
                <div class="input-with-icon">
                  <input type="email" class="form-control"
                    placeholder="Correo electrónico"
                    formControlName="email"
                    [ngClass]="{ 'is-invalid': loginForm.get('email')?.invalid && loginForm.get('email')?.touched }">
                  <i class="bi bi-envelope"></i>
                  <div class="invalid-feedback" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                    <div *ngIf="loginForm.get('email')?.errors?.['required']">El correo es requerido</div>
                    <div *ngIf="loginForm.get('email')?.errors?.['email']">Ingrese un correo válido</div>
                  </div>
                </div>
              </div>

              <!-- Password -->
              <div class="form-group mb-4">
                <div class="input-with-icon">
                  <input type="password" class="form-control" placeholder="Contraseña" formControlName="password"
                    [ngClass]="{ 'is-invalid': loginForm.get('password')?.invalid && loginForm.get('password')?.touched }">
                  <i class="bi bi-lock"></i>
                  <div class="invalid-feedback"
                    *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                    <div *ngIf="loginForm.get('password')?.errors?.['required']">La contraseña es requerida</div>
                    <div *ngIf="loginForm.get('password')?.errors?.['minlength']">Mínimo 6 caracteres</div>
                  </div>
                </div>
              </div>

              <!-- Submit Button (mover dentro del form) -->
              <div class="text-center mb-3">
                <button type="submit" class="btn-submit">Ingresar</button>
              </div>

              <!-- Social Login Section (dentro del form) -->
              <div class="social-login-section">
                <div class="text-center mb-3">
                  <p>O ingresa usando</p>
                </div>
                <div class="text-center d-flex justify-content-center gap-2 mb-3">
                  <button type="button" class="btn btn-social-icon btn-facebook" title="Facebook">
                    <i class="bi bi-facebook"></i>
                  </button>
                  <button type="button" class="btn btn-social-icon btn-google" title="Google">
                    <i class="bi bi-google"></i>
                  </button>
                  <button type="button" class="btn btn-social-icon btn-microsoft" title="Microsoft">
                    <i class="bi bi-microsoft"></i>
                  </button>
                </div>
              </div>
            </form>

            <!-- 5. Links Section -->
            <div class="auth-links text-center mt-4">
              <p class="mb-2">
                <a href="#" class="text-accent">¿Olvidaste tu contraseña?</a>
              </p>
              <p>
                ¿No tienes cuenta?
                <a routerLink="/auth/register" class="text-accent">Regístrate</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
