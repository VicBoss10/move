<div class="space-y-6">
  <!-- Información del Modelo y Acciones -->
  <app-camera-model-status-content
    [modelInfo$]="modelInfo$"
    [cameraStats$]="cameraStats$"
    [isRestarting]="isRestarting"
    [lastVehicleDetection$]="lastVehicleDetection$"
  ></app-camera-model-status-content>

  <!-- Filtros y Tabla de Dispositivos -->
  <div class="mt-8 space-y-6">
    <app-camera-filters-table [isServiceHealthy$]="isServiceHealthy$"></app-camera-filters-table>
  </div>
</div>
