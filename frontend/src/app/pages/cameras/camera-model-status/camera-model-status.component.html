<div class="space-y-6">
  <!-- Tarjetas de Estadísticas -->
  <ng-container *ngIf="cameraStats$ | async as stats">
    <app-camera-status-cards [stats]="stats" />
  </ng-container>

  <!-- Información del Modelo y Acciones -->
  <app-camera-model-status-content
    [modelInfo$]="modelInfo$"
    [isRestarting]="isRestarting"
    (restartModelClicked)="onRestartModel()"
  ></app-camera-model-status-content>

  <!-- Filtros y Tabla de Dispositivos -->
  <div class="mt-8 space-y-6">
    <app-camera-filters-table></app-camera-filters-table>
  </div>
</div>
