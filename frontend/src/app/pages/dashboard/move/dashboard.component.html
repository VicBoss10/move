<div class="grid grid-cols-12 gap-4 md:gap-6">
  <!-- System status banner -->
  <div class="col-span-12">
    <app-system-status />
  </div>

  <!-- Row 1: CO₂ heatmap + gas indicators / environment metrics -->
  <div class="col-span-12 xl:col-span-7">
    <app-pollution-heatmap />
  </div>

  <div class="col-span-12 xl:col-span-5 flex flex-col gap-6 md:gap-8">
    <div><app-gas-indicators /></div>
    <div><app-environment-metrics /></div>
  </div>

  <!-- Row 2: Vehicle activity + pollution summary -->
  <div class="col-span-12 xl:col-span-7">
    <app-vehicle-activity />
  </div>

  <div class="col-span-12 xl:col-span-5">
    <app-pollution-summary />
  </div>

  <!-- Row 3: Particle chart + temperature/humidity chart (equal halves) -->
  <div class="col-span-12 xl:col-span-6">
    <app-pollution-chart />
  </div>

  <div class="col-span-12 xl:col-span-6">
    <app-environment-chart />
  </div>
</div>
