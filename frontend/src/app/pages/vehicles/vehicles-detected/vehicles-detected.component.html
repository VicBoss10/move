<div class="grid grid-cols-12 gap-4 md:gap-6">
  <!-- Filters -->
  <div class="col-span-12">
    <app-vehicle-filters (filterChange)="handleFilterChange($event)" />
  </div>

  <!-- Charts: rendered from the first change detection so the page never looks stuck;
       the child shows its own spinner while isLoading is true. -->
  <div class="col-span-12">
    <app-vehicle-detection-charts
      [vehicleDetections]="(vehicles$ | async) ?? []"
      [isLoading]="isLoading"
    />
  </div>

  <!-- Table -->
  <div class="col-span-12">
    <!-- Loading state -->
    @if (isLoading) {
      <div class="flex items-center justify-center py-16">
        <div class="flex flex-col items-center gap-3">
          <div
            class="h-8 w-8 animate-spin rounded-full border-4 border-gray-200 border-t-brand-500 dark:border-gray-700 dark:border-t-brand-500"
          ></div>
          <p class="text-sm text-gray-500 dark:text-gray-400">Cargando vehículos detectados...</p>
        </div>
      </div>
    }

    <!-- Error state -->
    @if (errorMessage && !isLoading) {
      <div class="bg-red-50 border border-red-200 rounded-lg p-4">
        <p class="text-red-600">{{ errorMessage }}</p>
      </div>
    }

    <!-- Stats view: rows por tipo -->
    @if (!isLoading && !errorMessage) {
      @let stats = (stats$ | async) ?? [];
      @if (stats.length > 0) {
        <app-vehicle-table [stats]="stats" />
      } @else {
        <!-- Empty state -->
        <div class="flex flex-col items-center justify-center py-12 text-gray-500">
          <p>No hay vehículos detectados</p>
        </div>
      }
    }
  </div>
</div>
