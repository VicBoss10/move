services:
  frontend:
    container_name: move-frontend
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "80:80"
    environment:
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
    depends_on:
      - backend
    networks:
      - move-network
    profiles:
      - full

  backend:
    container_name: move-backend
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://move_db:5432/move_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - PYTHON_SERVICE_URL=http://vehicle-detection:5000
      # Keycloak - ISSUER_URI debe coincidir con el 'iss' del JWT (URL publica)
      - KEYCLOAK_ISSUER_URI=http://localhost:8081/realms/move
      # JWK_SET_URI usa la red interna Docker para obtener las claves publicas
      - KEYCLOAK_JWK_SET_URI=http://keycloak:8080/realms/move/protocol/openid-connect/certs
      # Admin client usa la red interna Docker
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=move
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin123
    depends_on:
      - move_db
      - keycloak
    networks:
      - move-network

  vehicle-detection:
    container_name: move-vehicle-detection
    build:
      context: ./vehicle-detection-service
      dockerfile: dockerfile
    ports:
      - "5000:5000"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8080}
    networks:
      - move-network
    profiles:
      - full

  keycloak_db:
    container_name: keycloak_db
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
      POSTGRES_DB: keycloak_db
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - move-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    container_name: move-keycloak
    image: keycloak/keycloak:latest
    ports:
      - "8081:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KC_PROXY: edge
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/move-realm-import.json:/opt/keycloak/data/import/move-realm-import.json:ro
    depends_on:
      keycloak_db:
        condition: service_healthy
    networks:
      - move-network
    command: start-dev --import-realm

  move_db:
    container_name: move_db
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: move_db
    volumes:
      - move_db_data:/var/lib/postgresql/data
    networks:
      - move-network

  pgadmin:
    container_name: move-pgadmin
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - move_db
    networks:
      - move-network
    restart: unless-stopped
    profiles:
      - full

  cloudflare-tunnel:
    container_name: cloudflare-tunnel
    image: cloudflare/cloudflared:latest
    command: tunnel --config /home/nonroot/.cloudflared/config.yml run
    volumes:
      - ~/cloudflared:/home/nonroot/.cloudflared
    depends_on:
      - backend
    restart: unless-stopped
    network_mode: host
    profiles:
      - full

volumes:
  move_db_data:
  keycloak_db_data:

networks:
  move-network:
    driver: bridge