services:
  frontend:
    container_name: move-frontend
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "80:80"
    environment:
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
    depends_on:
      - backend
    networks:
      - move-network
    profiles:
      - full

  backend:
    container_name: move-backend
    build:
      context: ./backend
      dockerfile: dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://move_db:5432/move_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - PYTHON_SERVICE_URL=http://vehicle-detection:5000
    depends_on:
      - move_db
    networks:
      - move-network

  vehicle-detection:
    container_name: move-vehicle-detection
    build:
      context: ./vehicle-detection-service
      dockerfile: dockerfile
    ports:
      - "5000:5000"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8080}
    networks:
      - move-network
    profiles:
      - full

  move_db:
    container_name: move_db
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: move_db
    volumes:
      - move_db_data:/var/lib/postgresql/data
    networks:
      - move-network

  pgadmin:
    container_name: move-pgadmin
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    depends_on:
      - move_db
    networks:
      - move-network
    restart: unless-stopped
    profiles:
      - full

  cloudflare-tunnel:
    container_name: cloudflare-tunnel
    image: cloudflare/cloudflared:latest
    command: tunnel --config /home/nonroot/.cloudflared/config.yml run
    volumes:
      - ~/cloudflared:/home/nonroot/.cloudflared
    depends_on:
      - backend
    restart: unless-stopped
    network_mode: host
    profiles:
      - full

volumes:
  move_db_data:

networks:
  move-network:
    driver: bridge