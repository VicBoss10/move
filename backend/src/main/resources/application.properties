# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://move_db:5432/move_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# OpenAPI/Swagger Documentation
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=method

# Python Detection Service Configuration
python.service.url=${PYTHON_SERVICE_URL}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# OAuth2/OIDC Configuration - Keycloak
# KEYCLOAK_ISSUER_URI: Public Keycloak URL used to validate JWT 'iss' claim
# KEYCLOAK_JWK_SET_URI: Internal Keycloak URL for backend to fetch signing keys
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI}
spring.application.name=move-backend

# Keycloak Admin Client Configuration
keycloak.server-url=${KEYCLOAK_SERVER_URL}
keycloak.realm=${KEYCLOAK_REALM}
keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD}
keycloak.admin-client-id=admin-cli

# Device Provisioning Configuration
# Factory token for ESP32 self-registration in SoftAP/captive-portal flows
provisioning.factory-token=${PROVISIONING_FACTORY_TOKEN:}
# Time in seconds to wait for first sensor data before rolling back provisional device
provisioning.ttl-seconds=${PROVISIONING_TTL_SECONDS:120}

# Device State Management
# Minutes without sensor data before marking device as INACTIVE (Colombia timezone)
device.state.inactive-minutes=${DEVICE_STATE_INACTIVE_MINUTES:3}
# Minutes without detections before marking camera device as INACTIVE (Colombia timezone)
device.state.camera-inactive-minutes=${DEVICE_STATE_CAMERA_INACTIVE_MINUTES:60}
# Interval in milliseconds between device state evaluation runs
device.state.check-interval-ms=${DEVICE_STATE_CHECK_INTERVAL_MS:60000}

spring.mvc.problemdetails.enabled=true
