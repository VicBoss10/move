# Puerto de la aplicacion
server.port=8080

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://move_db:5432/move_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging for debugging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Swagger UI Config
springdoc.api-docs.path=/docs
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operationsSorter=method

# Python Service Configuration
python.service.url=${PYTHON_SERVICE_URL:http://localhost:5000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost,http://localhost:80,https://moveiot.online}

# OAuth2 / OIDC Configuration - Keycloak
# KEYCLOAK_ISSUER_URI: URL publica de Keycloak (coincide con el claim 'iss' del JWT)
# KEYCLOAK_JWK_SET_URI: URL interna para que el backend obtenga las claves publicas
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/move}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/move/protocol/openid-connect/certs}
spring.application.name=move-backend

# Keycloak Admin Client Configuration
keycloak.server-url=${KEYCLOAK_SERVER_URL}
keycloak.realm=${KEYCLOAK_REALM}
# Admin admin credentials - DO NOT commit real secrets
# Provide admin username, password and admin client id (no client secret)
keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD}
keycloak.admin-client-id=admin-cli

# Provisioning factory token (used by devices in SoftAP/captive-portal provisioning)
# Set via environment variable PROVISIONING_FACTORY_TOKEN or here for testing
provisioning.factory-token=${PROVISIONING_FACTORY_TOKEN:}

# Provisioning TTL in seconds - time to wait for first sensor data before rolling back provisional device
provisioning.ttl-seconds=${PROVISIONING_TTL_SECONDS:120}

# Device state evaluation
# Minutes without data before a SENSOR device is marked INACTIVE (Colombia time)
device.state.inactive-minutes=${DEVICE_STATE_INACTIVE_MINUTES:3}
# Minutes without detections before a CAMERA device is marked INACTIVE (Colombia time)
device.state.camera-inactive-minutes=${DEVICE_STATE_CAMERA_INACTIVE_MINUTES:60}
# Interval in ms between state evaluation runs (default 60 s)
device.state.check-interval-ms=${DEVICE_STATE_CHECK_INTERVAL_MS:60000}

spring.mvc.problemdetails.enabled=true
